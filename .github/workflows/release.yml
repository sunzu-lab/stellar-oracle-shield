name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  CARGO_TERM_COLOR: always
  PACKAGE: stellar-oracle-shield

jobs:
  # Builds the contract and publishes the GitHub Release.
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stellar-cli
        uses: stellar/stellar-cli@5a7c5fe76530bf4248477ac812fc757146b98cc4 # v27.0.0
        with:
          version: "27.0.0"

      - name: Resolve version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME}"
          VERSION="${VERSION#v}"
          CRATE_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          # The released binary and the crate must claim the same version.
          if [ "${VERSION}" != "${CRATE_VERSION}" ]; then
            echo "::error::Tag v${VERSION} does not match the crate version (${CRATE_VERSION} in Cargo.toml). Align them before tagging."
            exit 1
          fi
          echo "WASM=${PACKAGE}_v${VERSION}.wasm" >> "$GITHUB_ENV"

      - name: Build WASM
        uses: ./.github/actions/build-wasm
        with:
          package: ${{ env.PACKAGE }}
          out-dir: out
          name: ${{ env.WASM }}

      - name: Hash the WASM
        run: sha256sum "out/${WASM}" | tee "out/${WASM}.sha256"

      - name: Share the WASM with the SDK job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-wasm
          path: out/${{ env.WASM }}
          retention-days: 1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ env.WASM }}

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          GENERATED_NOTES="$(
            gh api \
              --method POST \
              "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${REF_NAME}" \
              --jq '.body'
          )"

          {
            echo "## Build information"
            echo "| | |"
            echo "|---|---|"
            echo "| SHA-256 | \`$(cut -d' ' -f1 "out/${WASM}.sha256")\` |"
            echo "| stellar-cli | \`$(stellar --version | grep -oP 'stellar \K\S+' | head -1)\` |"
            echo "| rust | \`$(rustc --version)\` |"
            echo
            echo "Built with:"
            echo "\`\`\`"
            echo "stellar contract build --optimize --package ${PACKAGE} --meta source_repo=github:${{ github.repository }}"
            echo "\`\`\`"
            echo
            echo "---"
            echo
            printf '%s\n' "${GENERATED_NOTES}"
          } > notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "${REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${REF_NAME}" \
              --title "${REF_NAME}" \
              --notes-file notes.md

            gh release upload "${REF_NAME}" \
              "out/${WASM}" \
              "out/${WASM}.sha256"
          else
            gh release create "${REF_NAME}" \
              "out/${WASM}" \
              "out/${WASM}.sha256" \
              --title "${REF_NAME}" \
              --notes-file notes.md \
              --verify-tag
          fi

      - name: Send release info to stellar.expert
        continue-on-error: true
        env:
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          COMMIT_HASH: ${{ github.sha }}
          JOB_ID: ${{ github.job }}
          RUN_ID: ${{ github.run_id }}
          PACKAGE_NAME: ${{ env.PACKAGE }}
        run: |
          export CONTRACT_HASH=$(cut -d' ' -f1 "out/${WASM}.sha256")
          JSON_OBJECT=$(node -e "console.log(JSON.stringify({
            repository: process.env.REPOSITORY,
            commitHash: process.env.COMMIT_HASH,
            jobId: process.env.JOB_ID,
            runId: process.env.RUN_ID,
            contractHash: process.env.CONTRACT_HASH,
            packageName: process.env.PACKAGE_NAME
          }))")
          echo "JSON to send: $JSON_OBJECT"
          curl -X POST "https://api.stellar.expert/explorer/public/contract-validation/match" \
               -H "Content-Type: application/json" \
               -d "$JSON_OBJECT" \
               --max-time 15

  # publish the rust contract client crate
  rust-sdk:
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-sdk.yml

  # publish the typescript sdk
  typescript-sdk:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/typescript-sdk.yml
    with:
      version: ${{ github.ref_name }}
      wasm-artifact: contract-wasm
      publish: true
