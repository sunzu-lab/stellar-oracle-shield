name: Validate and publish Rust SDK crate

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

env:
  CRATE_NAME: stellar-oracle-shield-client
  CRATE_MANIFEST: contracts/oracle-shield-client/Cargo.toml

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup update

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --locked --package "$CRATE_NAME" --all-features

      - name: Simulate publication
        run: |
          cargo publish \
            --dry-run \
            --locked \
            --package "$CRATE_NAME"

      - name: Inspect packaged files
        run: |
          cargo package \
            --locked \
            --package "$CRATE_NAME" \
            --list

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup update

      - name: Verify tag matches crate version
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_VERSION#v}"

          CRATE_VERSION="$(
            cargo metadata \
              --format-version 1 \
              --no-deps \
              --manifest-path "$CRATE_MANIFEST" |
            jq -r \
              --arg crate "$CRATE_NAME" \
              '.packages[] | select(.name == $crate) | .version'
          )"

          test "$TAG_VERSION" = "$CRATE_VERSION" || {
            echo "::error::Tag version $TAG_VERSION does not match crate version $CRATE_VERSION"
            exit 1
          }

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        run: cargo publish --locked --package "$CRATE_NAME"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
