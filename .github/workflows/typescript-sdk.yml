name: typescript-sdk

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      version:
        description: "Version to publish (the tag, e.g. v0.1.0)."
        required: true
        type: string
      wasm-artifact:
        description: "Workflow artifact holding the released WASM. Empty (manual runs) means build it here."
        required: false
        type: string
        default: ""
      publish:
        description: "Actually publish to the registry. Anything else is a dry-run."
        required: false
        type: boolean
        default: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  NPM_REGISTRY: "https://npm.pkg.github.com"
  PACKAGE: stellar-oracle-shield

jobs:
  publish:
    runs-on: ubuntu-latest
    # Real publishes need the protected environment's approval; dry-runs don't.
    environment: ${{ inputs.publish && 'release' || 'dry-run' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only useful when we compile the WASM ourselves.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.wasm-artifact }}

      - name: Resolve owner scope
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "SCOPE=@${OWNER}" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=@${OWNER}/oracle-shield-ts-sdk" >> "$GITHUB_ENV"
          echo "Resolved scope: @${OWNER}"

      - name: Resolve mode and version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          CRATE_VERSION=$(grep -m1 '^version = ' contracts/oracle-shield/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "${{ inputs.publish }}" = "true" ]; then
            DRY_RUN=false
            VERSION="${INPUT_VERSION}"
            VERSION="${VERSION#v}"
            # Guard: the tag MUST match the crate version, otherwise the published
            # SDK and the contract would show different version numbers.
            if [ "${VERSION}" != "${CRATE_VERSION}" ]; then
              echo "::error::Tag v${VERSION} does not match the crate version (${CRATE_VERSION} in contracts/oracle-shield/Cargo.toml). Align them before tagging."
              exit 1
            fi
          else
            DRY_RUN=true
            VERSION="${CRATE_VERSION}"
          fi
          echo "DRY_RUN=${DRY_RUN}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "dry-run: ${DRY_RUN} — version: ${VERSION}"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: ${{ env.SCOPE }}

      - name: Download the released WASM
        if: ${{ inputs.wasm-artifact }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.wasm-artifact }}
          path: wasm

      - name: Build WASM
        if: ${{ !inputs.wasm-artifact }}
        uses: ./.github/actions/build-wasm
        with:
          package: ${{ env.PACKAGE }}
          out-dir: wasm

      - name: Generate TypeScript bindings
        run: |
          WASM=$(find wasm -name '*.wasm' | head -1)
          echo "Generating bindings from ${WASM}"
          npx @stellar/stellar-sdk@16.2.0 generate \
            --wasm "${WASM}" \
            --output-dir sdk/typescript/packages/generated \
            --contract-name "${PACKAGE}" \
            --overwrite

      - name: Set package metadata
        working-directory: sdk/typescript/packages/generated
        run: |
          npm pkg set name="${PACKAGE_NAME}"
          npm pkg set version="${VERSION}"
          npm pkg set repository.type="git"
          npm pkg set repository.url="git+https://github.com/${{ github.repository }}.git"
          npm pkg set publishConfig.registry="${NPM_REGISTRY}"

      - name: Build package
        working-directory: sdk/typescript/packages/generated
        run: | # zizmor: ignore[adhoc-packages]
          npm install
          npm install --save-dev @types/node
          npm run build

      - name: Publish to GitHub Packages
        working-directory: sdk/typescript/packages/generated
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: | # zizmor: ignore[use-trusted-publishing]
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Manual run → validation only (dry-run), nothing is published."
            npm publish --dry-run
          else
            npm publish
            echo "Published: ${PACKAGE_NAME}@${VERSION}"
          fi
