name: Build WASM
description: >
  Build the contract to the WASM.

inputs:
  package:
    description: Cargo crate to build.
    required: true
  name:
    description: Filename to give the WASM. Defaults to the crate's own artifact name.
    required: false
    default: ""

outputs:
  wasm:
    description: Path to the built WASM.
    value: ${{ steps.build.outputs.wasm }}

runs:
  using: composite
  steps:
    - uses: stellar/stellar-cli@300aaf69ab100536678bdb641428b06f06b318ea # v28.0.0
      with:
        version: "28.0.0"

    - id: build
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail

        # Validate Cargo package name.
        if [[ ! "$PACKAGE" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ ]]; then
          echo "::error::Invalid package name"
          exit 1
        fi

        # Validate output filename (basename only).
        if [[ -n "$NAME" ]]; then
          if [[ ! "$NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]] ||
             [[ "$NAME" == *..* ]]; then
            echo "::error::Invalid WASM filename"
            exit 1
          fi
        fi

        rustup update
        rustup target add wasm32v1-none

        stellar contract build --optimize \
          --package "${PACKAGE}" \
          --meta source_repo="github:${{ github.repository }}"

        OUT_DIR="target/wasm32v1-none/release"
        WASM_BASENAME="${PACKAGE//-/_}.wasm"
        WASM_FILENAME="${OUT_DIR}/${WASM_BASENAME}"

        # Mainnet caps contracts at 128 KiB; fail at half that, before it hurts.
        SIZE=$(stat -c %s "${WASM_FILENAME}")
        echo "${WASM_FILENAME}: ${SIZE} bytes"
        if [ "${SIZE}" -gt 65536 ]; then
          echo "::error::${WASM_FILENAME} is ${SIZE} bytes, over the 64 KiB budget (mainnet limit: 128 KiB)."
          exit 1
        fi

        OUT_WASM="${OUT_DIR}/${NAME:-${WASM_BASENAME}}"

        if [ "${WASM_FILENAME}" != "${OUT_WASM}" ]; then
          cp "${WASM_FILENAME}" "${OUT_WASM}"
        fi

        echo "wasm=${OUT_WASM}" >> "$GITHUB_OUTPUT"
